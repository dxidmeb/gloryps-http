<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GloryPs Admin Panel</title>
<style>
:root{
  --bg:#0d0d0d; --panel:#141414; --panel2:#191919; --panel3:#111; --border:#262626;
  --text:#e0e0e0; --muted:#8a939b; --accent:#3a4a5a; --accent2:#2e3d4d;
  --ok:#4a6a55; --err:#7a4a4a; --warn:#6a5a3a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;overflow-x:hidden}
a{color:inherit}
.app{display:flex;min-height:100vh}

/* Sidebar */
aside{width:230px;background:var(--panel3);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{padding:18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
.brand span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.closebtn{display:none;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
nav{flex:1;padding:10px 0;overflow:auto}
nav a{display:flex;align-items:center;gap:10px;padding:12px 20px;color:var(--muted);text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer;min-height:44px}
nav a:hover{color:var(--text);background:#161616}
nav a.active{color:var(--text);background:#181d22;border-left-color:var(--accent)}
nav a .ic{width:16px;text-align:center;opacity:.85}
.sideft{padding:14px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.sideft .who{margin-bottom:8px;word-break:break-all}
.sideft button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:9px 12px;cursor:pointer;font-size:12px;width:100%;min-height:40px}
.sideft button:hover{color:var(--text);border-color:var(--accent)}

/* Topbar (mobile) */
.topbar{display:none;position:sticky;top:0;z-index:40;background:var(--panel3);border-bottom:1px solid var(--border);padding:10px 14px;align-items:center;gap:12px}
.topbar .burger{background:none;border:1px solid var(--border);color:var(--text);border-radius:6px;width:42px;height:42px;font-size:18px;cursor:pointer}
.topbar h1{font-size:14px;margin:0;font-weight:600}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45}

/* Main */
main{flex:1;min-width:0;overflow-x:hidden;padding:26px 30px}
h2{font-size:18px;font-weight:600;margin:0 0 4px}
p.sub{color:var(--muted);font-size:12px;margin:0 0 20px}
.hidden{display:none!important}

/* Cards / dashboard */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.card .n{font-size:26px;font-weight:600}
.card .l{font-size:12px;color:var(--muted);margin-top:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.dot.up{background:var(--ok)}.dot.down{background:var(--err)}
.statusrow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.pill{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:6px}
.pill small{color:var(--muted)}

/* Buttons */
.btn{background:var(--accent2);border:1px solid var(--accent);color:#dfe6ec;padding:9px 16px;border-radius:7px;font-size:13px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:#354657}
.btn.ok{background:#26382e;border-color:var(--ok)}
.btn.ok:hover{background:#2e4438}
.btn.danger{background:#3a2626;border-color:var(--err)}
.btn.danger:hover{background:#442e2e}
.btn.ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:12px;min-height:34px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}

/* Panels/sections */
.section{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.section h3{margin:0 0 12px;font-size:14px;font-weight:600}
.logbox{background:#0b0b0b;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#b8c0c8;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow:auto;line-height:1.6}

/* Inputs */
input,select,textarea{background:#0d0d0d;border:1px solid #2c2c2c;border-radius:7px;color:var(--text);padding:10px 12px;font-size:14px;outline:none;font-family:inherit;min-height:40px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{width:auto;flex:1;min-width:140px}

/* Tables (desktop) */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;background:var(--panel);min-width:520px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #1f1f1f;font-size:13px;white-space:nowrap}
th{background:var(--panel2);color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:#1a1f24}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;border:1px solid var(--border);background:#161616;color:var(--muted)}
.tag.ban{background:#3a2626;border-color:var(--err);color:#c99}
.tag.role{background:#232d36;border-color:var(--accent);color:#bcd}

/* Card list (mobile alt for tables) */
.cardlist{display:none;flex-direction:column;gap:10px}
.rowcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer}
.rowcard:active{background:#1a1f24}
.rowcard .t{font-size:15px;font-weight:600;margin-bottom:6px;word-break:break-word}
.rowcard .kv{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.rowcard .kv b{color:var(--text);font-weight:500}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:640px;margin:auto}
.modal h3{margin:0 0 4px;font-size:16px}
.modal .mhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.modal .x{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Player editor form */
.pbody{max-height:70vh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-right:4px;margin:0 -2px}
.pbody .section{margin-bottom:14px}
.chkgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
label.chk{display:flex;align-items:center;gap:8px;margin:0;font-size:13px;color:var(--text);cursor:pointer;word-break:break-word}
label.chk input[type=checkbox]{width:auto;min-height:0;margin:0;flex-shrink:0;width:16px;height:16px;cursor:pointer}
details.adv{border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:8px;background:#0f0f0f}
details.adv summary{cursor:pointer;font-size:13px;color:var(--muted);word-break:break-all;list-style:revert}
details.adv summary:hover{color:var(--text)}
details.adv[open] summary{margin-bottom:8px;color:var(--text)}
details.adv textarea{width:100%}

/* Toast */
#toast{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px;max-width:90vw}
.toast{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--accent);color:var(--text);padding:12px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:340px}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}
.meta{font-size:12px;color:var(--muted);margin-top:8px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.count{font-size:12px;color:var(--muted)}

/* Responsive */
@media (max-width:768px){
  aside{position:fixed;left:0;top:0;height:100vh;z-index:50;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.6)}
  aside.open{transform:translateX(0)}
  .closebtn{display:block}
  .topbar{display:flex}
  .backdrop.show{display:block}
  main{padding:16px}
  .grid2{grid-template-columns:1fr}
  .chkgrid{grid-template-columns:1fr}
  .pbody{max-height:none}
  .cards{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  table{display:none}
  .tablewrap{border:none}
  .cardlist{display:flex}
  h2{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <div class="backdrop" id="backdrop" onclick="closeNav()"></div>
  <aside id="sidebar">
    <div class="brand">
      <div><h1>GloryPs Admin</h1><span>Server Management</span></div>
      <button class="closebtn" onclick="closeNav()">&times;</button>
    </div>
    <nav id="nav">
      <a data-view="dashboard" class="active" onclick="nav('dashboard')"><span class="ic">▣</span> Dashboard</a>
      <a data-view="control" onclick="nav('control')"><span class="ic">⚙</span> Server Control</a>
      <a data-view="players" onclick="nav('players')"><span class="ic">◉</span> Players</a>
      <a data-view="worlds" onclick="nav('worlds')"><span class="ic">◈</span> Worlds</a>
      <a data-view="json" onclick="nav('json')"><span class="ic">{}</span> JSON Files</a>
      <a data-view="text" onclick="nav('text')"><span class="ic">≡</span> Text Files</a>
      <a data-view="roles" onclick="nav('roles')"><span class="ic">✦</span> Roles</a>
      <a data-view="backups" onclick="nav('backups')"><span class="ic">⟲</span> Backups</a>
    </nav>
    <div class="sideft">
      <div class="who">Signed in as <b id="whoami">…</b></div>
      <button onclick="logout()">Sign out</button>
    </div>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div class="topbar">
      <button class="burger" onclick="openNav()">☰</button>
      <h1 id="topTitle">Dashboard</h1>
    </div>
    <main id="main"></main>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
const $ = (s,r=document)=>r.querySelector(s);
let CSRF = "";
const state = { players:[], worlds:[] };

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtSize(b){if(b<1024)return b+" B";if(b<1048576)return (b/1024).toFixed(1)+" KB";return (b/1048576).toFixed(1)+" MB";}
function fmtTime(ms){try{return new Date(ms).toLocaleString();}catch(e){return "-";}}
function fmtDur(s){if(!s)return "-";const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+"h ":"")+m+"m";}

function toast(msg,type){
  const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;
  $('#toast').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .4s';setTimeout(()=>t.remove(),400);},3200);
}
async function api(pathname,opts={}){
  opts.headers=opts.headers||{};
  if(opts.body){opts.headers['Content-Type']='application/json';}
  if(['POST','PUT','DELETE'].includes((opts.method||'GET').toUpperCase())){opts.headers['X-CSRF-Token']=CSRF;}
  const r=await fetch('/admin'+pathname,opts);
  if(r.status===401){location.href='/admin/login';throw new Error('unauth');}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function logout(){try{await api('/api/logout',{method:'POST'});}catch(e){}location.href='/admin/login';}

/* nav */
function openNav(){$('#sidebar').classList.add('open');$('#backdrop').classList.add('show');}
function closeNav(){$('#sidebar').classList.remove('open');$('#backdrop').classList.remove('show');}
const TITLES={dashboard:'Dashboard',control:'Server Control',players:'Players',worlds:'Worlds',json:'JSON Files',text:'Text Files',roles:'Roles',backups:'Backups'};
function nav(v){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===v));
  $('#topTitle').textContent=TITLES[v]||'';
  closeNav();
  render(v);
}

/* views */
async function render(v){
  const m=$('#main');m.innerHTML='<p class="sub">Loading…</p>';
  try{
    if(v==='dashboard')return renderDashboard(m);
    if(v==='control')return renderControl(m);
    if(v==='players')return renderPlayers(m);
    if(v==='worlds')return renderWorlds(m);
    if(v==='json')return renderDir(m,'database/json','JSON Files',true);
    if(v==='text')return renderDir(m,'database/text','Text Files',false);
    if(v==='roles')return renderRoles(m);
    if(v==='backups')return renderBackups(m);
  }catch(e){m.innerHTML='<p class="sub">Error: '+esc(e.message)+'</p>';}
}

/* ---------- Dashboard ---------- */
async function renderDashboard(m){
  const info=await api('/api/info');
  const g=info.status.game_udp,h=info.status.http;
  m.innerHTML=`
    <h2>Dashboard</h2><p class="sub">Live overview of ${esc(info.server_path)}</p>
    <div class="cards">
      <div class="card"><div class="n">${info.counts.players}</div><div class="l">Players</div></div>
      <div class="card"><div class="n">${info.counts.worlds}</div><div class="l">Worlds</div></div>
      <div class="card"><div class="n">${info.counts.json}</div><div class="l">JSON files</div></div>
      <div class="card"><div class="n">${info.counts.text}</div><div class="l">Text files</div></div>
    </div>
    <div class="statusrow">
      <div class="pill"><span class="dot ${g.up?'up':'down'}"></span> Game server <small>UDP ${g.port} · ${g.up?'online':'offline'}${g.uptime?' · '+fmtDur(g.uptime):''}</small></div>
      <div class="pill"><span class="dot ${h.up?'up':'down'}"></span> HTTP server <small>TCP ${h.port} · ${h.up?'online':'offline'}</small></div>
    </div>
    <div class="btnrow">
      <button class="btn ok" onclick="ctrl('game:start')">Start Game</button>
      <button class="btn danger" onclick="ctrl('game:stop')">Stop Game</button>
      <button class="btn" onclick="ctrl('game:restart')">Restart Game</button>
    </div>
    <div class="section"><div class="spread"><h3>Recent Activity</h3><button class="btn ghost sm" onclick="render('dashboard')">Refresh</button></div>
      <div class="logbox" id="auditbox">Loading…</div></div>`;
  try{const l=await api('/api/logs?n=12');$('#auditbox').textContent=(l.lines||[]).join('\n')||'No activity yet.';}catch(e){$('#auditbox').textContent='—';}
}

async function ctrl(action){
  if(action==='game:stop'&&!confirm('Stop the game server?'))return;
  if(action==='http:restart'&&!confirm('Restart the HTTP server? Panel will disconnect briefly.'))return;
  try{const r=await api('/api/server/control',{method:'POST',body:JSON.stringify({action})});
    toast((r.note||('Done: '+action)),'ok');
    setTimeout(()=>{const cur=document.querySelector('#nav a.active');if(cur)render(cur.dataset.view);},600);
  }catch(e){toast(e.message,'err');}
}

/* ---------- Server Control ---------- */
async function renderControl(m){
  const s=await api('/api/server/status');
  m.innerHTML=`
    <h2>Server Control</h2><p class="sub">Strict command allowlist — no arbitrary execution</p>
    <div class="section">
      <h3><span class="dot ${s.game.up?'up':'down'}"></span> Game Server</h3>
      <div class="meta">Binary: ${esc(s.game.bin)}<br>CWD: ${esc(s.game.cwd)}<br>
        UDP port: ${s.game.port} · Status: ${s.game.up?'online':'offline'} · PID: ${s.game.pid||'—'} · Uptime: ${fmtDur(s.game.uptime)}</div>
      <div class="btnrow" style="margin-top:14px">
        <button class="btn ok" onclick="ctrl('game:start')">Start</button>
        <button class="btn danger" onclick="ctrl('game:stop')">Stop</button>
        <button class="btn" onclick="ctrl('game:restart')">Restart</button>
      </div>
    </div>
    <div class="section">
      <h3><span class="dot ${s.http.up?'up':'down'}"></span> HTTP Server</h3>
      <div class="meta">TCP port: ${s.http.port} · Status: ${s.http.up?'online':'offline'} · PID: ${s.http.pid}</div>
      <div class="btnrow" style="margin-top:14px">
        <button class="btn danger" onclick="ctrl('http:restart')">Restart HTTP</button>
        <button class="btn ghost" onclick="render('control')">Refresh</button>
      </div>
      <div class="meta">Note: HTTP restart exits this process; a supervisor / start.sh must relaunch it.</div>
    </div>`;
}

/* ---------- Players ---------- */
async function renderPlayers(m){
  const {players}=await api('/api/players');state.players=players;
  m.innerHTML=`
    <h2>Players</h2><p class="sub">${players.length} player file(s)</p>
    <div class="toolbar"><input id="psearch" placeholder="Search name / role…" oninput="filterPlayers()">
      <select id="pfilter" onchange="filterPlayers()"><option value="">All</option><option value="banned">Banned only</option></select></div>
    <div id="ptable"></div>`;
  filterPlayers();
}
function filterPlayers(){
  const q=($('#psearch').value||'').toLowerCase();
  const f=$('#pfilter').value;
  let list=state.players.filter(p=>(!q||p.name.toLowerCase().includes(q)||String(p.role).toLowerCase().includes(q))&&(f!=='banned'||p.banned));
  const rows=list.map(p=>`<tr onclick="openPlayer('${esc(p.file)}')">
    <td>${esc(p.name)}</td><td>${p.gems.toLocaleString()}</td>
    <td><span class="tag role">${esc(p.role)}</span></td>
    <td>${p.banned?'<span class="tag ban">BANNED</span>':'<span class="tag">ok</span>'}</td></tr>`).join('');
  const cards=list.map(p=>`<div class="rowcard" onclick="openPlayer('${esc(p.file)}')">
    <div class="t">${esc(p.name)} ${p.banned?'<span class="tag ban">BANNED</span>':''}</div>
    <div class="kv"><span>Gems: <b>${p.gems.toLocaleString()}</b></span><span>Role: <b>${esc(p.role)}</b></span></div></div>`).join('');
  $('#ptable').innerHTML=`<div class="count">${list.length} shown</div>
    <div class="tablewrap"><table><thead><tr><th>Name</th><th>Gems</th><th>Role</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan=4>No players</td></tr>'}</tbody></table></div>
    <div class="cardlist">${cards||'<p class="sub">No players</p>'}</div>`;
}
/* Player editor: structured form built from the full fetched JSON object.
   We keep the ORIGINAL data around so Save can overlay edits and preserve all keys. */
const PLAYER_ROLES=['Role.Administrator','Role.BOOST','Role.Cheats','Role.Coder','Role.Developer','Role.Donatur','Role.God','Role.Moderator','Role.Owner_Server','Role.SUPER_BOOST','Role.Staff','Role.Streamers','Role.Unlimited','Role.Vip','Role.has_config_access'];
const PLAYER_ACCOUNT_STR=['email','pass','ip'];
let _playerData=null;      // original fetched object (source of truth)
let _playerFile=null;

function _valType(v){return Array.isArray(v)?'array':(v&&typeof v==='object')?'object':typeof v;}
function _fieldId(key){return 'pf_'+key.replace(/[^\w]/g,'_');}

async function openPlayer(file){
  const r=await api('/api/player?file='+encodeURIComponent(file));
  _playerData=r.data; _playerFile=file;
  const d=r.data, s=r.summary;

  // Account string fields present in this file
  const accStr=PLAYER_ACCOUNT_STR.filter(k=>k in d);
  const accStrHtml=accStr.map(k=>`<div><label>${esc(k)}</label><input id="${_fieldId(k)}" type="text" value="${esc(d[k])}"></div>`).join('');

  // Roles checkboxes (only those present)
  const rolesHtml=PLAYER_ROLES.filter(k=>k in d).map(k=>
    `<label class="chk"><input type="checkbox" id="${_fieldId(k)}" ${d[k]?'checked':''}> ${esc(k.replace(/^Role\./,''))}</label>`).join('');

  // Flags & Stats: other booleans + numbers (exclude the ones already shown / roles)
  const shown=new Set(['name','gems','banned','ban_reason',...PLAYER_ACCOUNT_STR,...PLAYER_ROLES]);
  const boolKeys=[], numKeys=[];
  for(const k of Object.keys(d)){
    if(shown.has(k)||k.startsWith('Role.'))continue;
    const t=_valType(d[k]);
    if(t==='boolean')boolKeys.push(k);
    else if(t==='number')numKeys.push(k);
  }
  boolKeys.sort(); numKeys.sort();
  const boolHtml=boolKeys.map(k=>`<label class="chk"><input type="checkbox" id="${_fieldId(k)}" ${d[k]?'checked':''}> ${esc(k)}</label>`).join('');
  const numHtml=numKeys.map(k=>`<div><label>${esc(k)}</label><input id="${_fieldId(k)}" type="number" step="any" value="${esc(d[k])}"></div>`).join('');

  // Advanced: arrays / objects as collapsible pretty-JSON textareas
  const advKeys=Object.keys(d).filter(k=>{const t=_valType(d[k]);return t==='array'||t==='object';}).sort();
  const advHtml=advKeys.map(k=>{
    const rows=Math.min(14,Math.max(4,JSON.stringify(d[k],null,2).split('\n').length));
    return `<details class="adv"><summary>${esc(k)} <span class="tag">${_valType(d[k])}</span></summary>
      <textarea id="${_fieldId(k)}" data-adv="1" rows="${rows}">${esc(JSON.stringify(d[k],null,2))}</textarea></details>`;
  }).join('');

  showModal(`
    <div class="mhead"><div><h3>${esc(s.name)}</h3><div class="meta">${esc(file)} · ${Object.keys(d).length} keys</div></div><button class="x" onclick="closeModal()">&times;</button></div>
    <div class="pbody">
      <div class="section">
        <h3>Account</h3>
        <div class="grid2">
          <div><label>Name</label><input id="${_fieldId('name')}" type="text" value="${esc(d.name==null?'':d.name)}"></div>
          <div><label>Gems</label><input id="${_fieldId('gems')}" type="number" step="any" value="${esc(d.gems==null?0:d.gems)}"></div>
        </div>
        <div class="grid2" style="margin-top:6px">
          <div><label>Banned</label><div style="padding-top:6px"><label class="chk"><input type="checkbox" id="${_fieldId('banned')}" ${d.banned?'checked':''}> banned</label></div></div>
          <div><label>Ban reason</label><input id="${_fieldId('ban_reason')}" type="text" value="${esc(d.ban_reason==null?'':d.ban_reason)}"></div>
        </div>
        ${accStr?`<div class="grid2" style="margin-top:6px">${accStrHtml}</div>`:''}
        <div class="btnrow" style="margin-top:14px">
          ${s.banned?`<button class="btn" onclick="playerAct('${esc(file)}','unban')">Quick Unban</button>`:`<button class="btn danger" onclick="playerAct('${esc(file)}','ban')">Quick Ban</button>`}
          <span class="tag role">${esc(s.role)}</span>
        </div>
      </div>

      <div class="section">
        <h3>Roles</h3>
        <div class="chkgrid">${rolesHtml||'<span class="sub">no role fields</span>'}</div>
      </div>

      <div class="section">
        <h3>Flags &amp; Stats</h3>
        ${numKeys.length?`<div class="grid2">${numHtml}</div>`:''}
        ${boolKeys.length?`<div class="chkgrid" style="margin-top:12px">${boolHtml}</div>`:''}
        ${(!numKeys.length&&!boolKeys.length)?'<span class="sub">none</span>':''}
      </div>

      <div class="section">
        <h3>Advanced</h3>
        <p class="sub" style="margin:0 0 10px">structured data — edit carefully (must stay valid JSON)</p>
        ${advHtml||'<span class="sub">none</span>'}
      </div>
    </div>
    <div class="btnrow" style="margin-top:14px">
      <button class="btn ok" onclick="savePlayer('${esc(file)}')">Save Changes</button>
      <button class="btn ghost" onclick="closeModal()">Close</button>
    </div>`);
}

async function playerAct(file,action,value){
  if(action==='ban'&&!confirm('Ban this player?'))return;
  try{await api('/api/player/update',{method:'POST',body:JSON.stringify({file,action,value})});
    toast('Player updated','ok');
    if($('#modal'))openPlayer(file); // re-render editor if modal is open
    else render('players');
  }catch(e){toast(e.message,'err');}
}

/* Build the full edited object from original data + form edits, preserving all keys. */
async function savePlayer(file){
  if(!_playerData||_playerFile!==file){return toast('Player data not loaded','err');}
  const out=JSON.parse(JSON.stringify(_playerData)); // clone all keys
  const getEl=k=>document.getElementById(_fieldId(k));

  // helper: set typed value preserving original type
  const setTyped=(k)=>{
    const el=getEl(k); if(!el)return;
    const orig=_playerData[k], t=_valType(orig);
    if(t==='boolean'){out[k]=el.checked;}
    else if(t==='number'){
      const n=Number(el.value);
      if(!Number.isFinite(n)){throw new Error('Invalid number for "'+k+'"');}
      out[k]=n;
    } else { out[k]=el.value; } // string (and null-origin treated as string)
  };

  try{
    // Account
    if(getEl('name'))out.name=getEl('name').value;
    if(getEl('gems')){const g=Number(getEl('gems').value);if(!Number.isFinite(g))throw new Error('Invalid gems');out.gems=g;}
    // banned/ban_reason: only write if present originally or the user set them (avoids adding keys to files that lack them)
    if(getEl('banned')&&('banned' in _playerData||getEl('banned').checked))out.banned=getEl('banned').checked;
    if(getEl('ban_reason')&&('ban_reason' in _playerData||getEl('ban_reason').value!==''))out.ban_reason=getEl('ban_reason').value;
    for(const k of PLAYER_ACCOUNT_STR){if(k in _playerData&&getEl(k))out[k]=getEl(k).value;}
    // Roles
    for(const k of PLAYER_ROLES){if(k in _playerData&&getEl(k))out[k]=getEl(k).checked;}
    // Flags & stats: iterate every remaining bool/number field
    const shown=new Set(['name','gems','banned','ban_reason',...PLAYER_ACCOUNT_STR,...PLAYER_ROLES]);
    for(const k of Object.keys(_playerData)){
      if(shown.has(k)||k.startsWith('Role.'))continue;
      const t=_valType(_playerData[k]);
      if(t==='boolean'||t==='number')setTyped(k);
    }
    // Advanced JSON textareas
    for(const k of Object.keys(_playerData)){
      const t=_valType(_playerData[k]);
      if(t!=='array'&&t!=='object')continue;
      const el=getEl(k); if(!el)continue;
      let parsed;
      try{parsed=JSON.parse(el.value);}catch(e){throw new Error('Invalid JSON in "'+k+'": '+e.message);}
      out[k]=parsed;
    }
  }catch(e){return toast(e.message,'err');}

  try{
    await api('/api/player/update',{method:'POST',body:JSON.stringify({file,action:'raw',value:out})});
    toast('Saved · '+Object.keys(out).length+' keys','ok');
    openPlayer(file); // re-fetch + re-render
  }catch(e){toast(e.message,'err');}
}

/* ---------- Worlds ---------- */
async function renderWorlds(m){
  const {worlds}=await api('/api/worlds');state.worlds=worlds;
  m.innerHTML=`<h2>Worlds</h2><p class="sub">${worlds.length} world file(s)</p>
    <div class="toolbar"><input id="wsearch" placeholder="Search name / owner…" oninput="filterWorlds()"></div>
    <div id="wtable"></div>`;
  filterWorlds();
}
function filterWorlds(){
  const q=($('#wsearch').value||'').toLowerCase();
  const list=state.worlds.filter(w=>!q||w.name.toLowerCase().includes(q)||String(w.owner).toLowerCase().includes(q));
  const dim=w=>(w.width&&w.height)?(w.width+'×'+w.height):'-';
  const rows=list.map(w=>`<tr onclick="openWorld('${esc(w.file)}')"><td>${esc(w.name)}</td><td>${esc(w.owner)}</td><td>${w.blocks.toLocaleString()}</td><td>${dim(w)}</td></tr>`).join('');
  const cards=list.map(w=>`<div class="rowcard" onclick="openWorld('${esc(w.file)}')"><div class="t">${esc(w.name)}</div>
    <div class="kv"><span>Owner: <b>${esc(w.owner)}</b></span><span>Blocks: <b>${w.blocks.toLocaleString()}</b></span><span>Size: <b>${dim(w)}</b></span></div></div>`).join('');
  $('#wtable').innerHTML=`<div class="count">${list.length} shown</div>
    <div class="tablewrap"><table><thead><tr><th>Name</th><th>Owner</th><th>Blocks</th><th>Size</th></tr></thead><tbody>${rows||'<tr><td colspan=4>No worlds</td></tr>'}</tbody></table></div>
    <div class="cardlist">${cards||'<p class="sub">No worlds</p>'}</div>`;
}
async function openWorld(file){
  const r=await api('/api/world?file='+encodeURIComponent(file));const s=r.summary;
  showModal(`<div class="mhead"><div><h3>${esc(s.name)}</h3><div class="meta">${esc(file)}</div></div><button class="x" onclick="closeModal()">&times;</button></div>
    <div class="grid2">
      <div class="pill"><small>Owner</small> <b>${esc(s.owner)}</b></div>
      <div class="pill"><small>Blocks</small> <b>${s.blocks.toLocaleString()}</b></div>
      <div class="pill"><small>Size</small> <b>${(s.width&&s.height)?(s.width+' × '+s.height):'—'}</b></div>
    </div>
    <label style="margin-top:14px">World JSON (blocks array summarized)</label>
    <textarea rows="16" readonly>${esc(JSON.stringify(r.data,null,2))}</textarea>
    <div class="btnrow" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Close</button></div>`);
}

/* ---------- Generic dir editor (json/text) ---------- */
async function renderDir(m,dir,title,isJson){
  const {files}=await api('/api/list?dir='+encodeURIComponent(dir));
  const rows=files.map(f=>`<tr onclick="openFile('${esc(dir)}/${esc(f.name)}','${isJson}')"><td>${esc(f.name)}</td><td>${fmtSize(f.size)}</td><td>${fmtTime(f.mtime)}</td></tr>`).join('');
  const cards=files.map(f=>`<div class="rowcard" onclick="openFile('${esc(dir)}/${esc(f.name)}','${isJson}')"><div class="t">${esc(f.name)}</div><div class="kv"><span>${fmtSize(f.size)}</span><span>${fmtTime(f.mtime)}</span></div></div>`).join('');
  m.innerHTML=`<h2>${esc(title)}</h2><p class="sub">${files.length} file(s) in ${esc(dir)}</p>
    <div class="tablewrap"><table><thead><tr><th>Name</th><th>Size</th><th>Modified</th></tr></thead><tbody>${rows||'<tr><td colspan=3>No files</td></tr>'}</tbody></table></div>
    <div class="cardlist">${cards||'<p class="sub">No files</p>'}</div>`;
}
async function openFile(relpath,isJson){
  isJson=(isJson===true||isJson==='true');
  const r=await api('/api/file?path='+encodeURIComponent(relpath));
  showModal(`<div class="mhead"><div><h3>${esc(relpath.split('/').pop())}</h3><div class="meta">${esc(relpath)}</div></div><button class="x" onclick="closeModal()">&times;</button></div>
    <textarea id="fed" rows="18">${esc(r.content)}</textarea>
    <div class="btnrow" style="margin-top:12px">
      ${isJson?'<button class="btn ghost sm" onclick="beautify(\'fed\')">Beautify</button>':''}
      <span class="count" id="fedc"></span>
    </div>
    <div class="btnrow"><button class="btn" onclick="saveFile('${esc(relpath)}',${isJson})">Save</button>
      <button class="btn danger" onclick="delFile('${esc(relpath)}')">Delete</button>
      <button class="btn ghost" onclick="closeModal()">Close</button></div>`);
  updateCount('fed','fedc');$('#fed').addEventListener('input',()=>updateCount('fed','fedc'));
}
async function saveFile(relpath,isJson){
  const content=$('#fed').value;
  if(isJson){try{JSON.parse(content);}catch(e){return toast('Invalid JSON: '+e.message,'err');}}
  try{await api('/api/file',{method:'POST',body:JSON.stringify({path:relpath,content})});
    toast('Saved','ok');closeModal();const cur=document.querySelector('#nav a.active');if(cur)render(cur.dataset.view);
  }catch(e){toast(e.message,'err');}
}
async function delFile(relpath){
  if(!confirm('Delete '+relpath+'? (a backup is kept)'))return;
  try{await api('/api/file?path='+encodeURIComponent(relpath),{method:'DELETE'});
    toast('Deleted','ok');closeModal();const cur=document.querySelector('#nav a.active');if(cur)render(cur.dataset.view);
  }catch(e){toast(e.message,'err');}
}

/* ---------- Roles ---------- */
async function renderRoles(m){
  const rel='database/roles.xaml';
  const r=await api('/api/file?path='+encodeURIComponent(rel));
  m.innerHTML=`<h2>Roles</h2><p class="sub">${esc(rel)}</p>
    <textarea id="fed" rows="22">${esc(r.content)}</textarea>
    <div class="btnrow" style="margin-top:12px"><span class="count" id="fedc"></span></div>
    <div class="btnrow"><button class="btn" onclick="saveFile('${esc(rel)}',false)">Save</button></div>`;
  updateCount('fed','fedc');$('#fed').addEventListener('input',()=>updateCount('fed','fedc'));

/* ---------- Backups ---------- */
async function renderBackups(m){
  m.innerHTML=`<h2>Backup Manager</h2><p class="sub">List &amp; restore automatic .bak-* snapshots</p>
    <div class="toolbar">
      <select id="bkdir" onchange="loadBackupFiles()">
        <option value="database/json">database/json</option>
        <option value="database/players">database/players</option>
        <option value="database/worlds">database/worlds</option>
        <option value="database/text">database/text</option>
      </select>
      <select id="bkfile" onchange="loadBackups()"></select>
    </div>
    <div id="bklist"><p class="sub">Select a file.</p></div>`;
  loadBackupFiles();
}
async function loadBackupFiles(){
  const dir=$('#bkdir').value;
  try{const {files}=await api('/api/list?dir='+encodeURIComponent(dir));
    $('#bkfile').innerHTML='<option value="">— select file —</option>'+files.map(f=>`<option value="${esc(dir)}/${esc(f.name)}">${esc(f.name)}</option>`).join('');
    $('#bklist').innerHTML='<p class="sub">Select a file.</p>';
  }catch(e){toast(e.message,'err');}
}
async function loadBackups(){
  const rel=$('#bkfile').value;if(!rel){$('#bklist').innerHTML='<p class="sub">Select a file.</p>';return;}
  try{const r=await api('/api/backups?path='+encodeURIComponent(rel));
    if(!r.backups.length){$('#bklist').innerHTML='<p class="sub">No backups for this file.</p>';return;}
    const rows=r.backups.map(b=>`<tr><td>${esc(b.name.split('.bak-')[1]||b.name)}</td><td>${fmtSize(b.size)}</td><td>${fmtTime(b.mtime)}</td>
      <td><button class="btn danger sm" onclick="restore('${esc(rel)}','${esc(b.name)}')">Restore</button></td></tr>`).join('');
    const cards=r.backups.map(b=>`<div class="rowcard"><div class="t">${esc(b.name.split('.bak-')[1]||b.name)}</div>
      <div class="kv"><span>${fmtSize(b.size)}</span><span>${fmtTime(b.mtime)}</span></div>
      <div style="margin-top:10px"><button class="btn danger sm" onclick="restore('${esc(rel)}','${esc(b.name)}')">Restore</button></div></div>`).join('');
    $('#bklist').innerHTML=`<div class="count">${r.backups.length} backup(s)</div>
      <div class="tablewrap"><table><thead><tr><th>Snapshot</th><th>Size</th><th>Created</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="cardlist">${cards}</div>`;
  }catch(e){toast(e.message,'err');}
}
async function restore(rel,backup){
  if(!confirm('Restore this backup over the live file? Current version is snapshotted first.'))return;
  try{await api('/api/restore',{method:'POST',body:JSON.stringify({path:rel,backup})});
    toast('Restored','ok');loadBackups();
  }catch(e){toast(e.message,'err');}
}

/* ---------- helpers ---------- */
function beautify(id){const t=$('#'+id);try{t.value=JSON.stringify(JSON.parse(t.value),null,2);toast('Beautified','ok');updateCount(id,id+'c');}catch(e){toast('Invalid JSON: '+e.message,'err');}}
function updateCount(taId,cId){const el=$('#'+cId);if(!el)return;const v=$('#'+taId).value;const lines=v?v.split('\n').length:0;const words=v.trim()?v.trim().split(/\s+/).length:0;el.textContent=lines+' lines · '+words+' words · '+v.length+' chars';}
function showModal(html){let mo=$('#modal');if(!mo){mo=document.createElement('div');mo.id='modal';mo.className='modal';mo.onclick=e=>{if(e.target===mo)closeModal();};document.body.appendChild(mo);}mo.innerHTML='<div class="box">'+html+'</div>';}
function closeModal(){const mo=$('#modal');if(mo)mo.remove();}

/* ---------- boot ---------- */
(async function(){
  try{const c=await api('/api/csrf');CSRF=c.token;}catch(e){}
  try{const info=await api('/api/info');$('#whoami').textContent=info.user||'admin';}catch(e){}
  render('dashboard');
})();
</script>
